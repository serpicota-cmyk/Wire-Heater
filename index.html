<style>

t-weight:600;margin-top:16px;padding:12px;background:#f0f7f8;border-radius:9px}.key span{display:flex;align-items:center;gap:9px}.key i{display:inline-block;flex:none;width:15px;height:15px;border-radius:50%;background:#3288ff}.key .heat{background:#dc2626}.scene{position:relative;overflow:hidden;background:linear-gradient(#eff8fa,#e1f0f2)}canvas{width:100%;height:100%;display:block;touch-action:none}.scene-label{position:absolute;left:16px;top:13px;font-size:11px;letter-spacing:.08em;color:#607c85;pointer-events:none}.readouts{position:absolute;right:14px;top:12px;display:flex;gap:8px;pointer-events:none}.readout{padding:8px 12px;background:#ffffffdc;border:1px solid #d9e6e9;border-radius:10px}.readout small{display:block;color:#6c818a;font-size:10px;text-transform:uppercase}.readout strong{font-size:20px;font-variant-numeric:tabular-nums}.status{position:absolute;bottom:10px;left:12px;right:12px;text-align:center;font-size:12px;color:#3c626d}.data{padding:12px 16px;overflow:hidden}.data-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.data-head h2{margin:0}.data-head span{font-size:11px;color:#607983}table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}th{text-align:left;color:#5a747e;font-size:10px;text-transform:uppercase;letter-spacing:.03em;background:#f4f8f9}td,th{padding:7px 6px;border-bottom:1px solid #e7eef0;white-space:nowrap}td:last-child{color:#19724b;font-weight:700}.empty{text-align:center;color:#7e939b;height:84px}.pager{display:flex;justify-content:flex-end;align-items:center;gap:10px;font-size:11px;margin-top:7px}.pager button{border:0;border-radius:5px;background:#edf3f5;color:#365f6d;padding:3px 10px}#record{background:#246778;color:white}.toast{min-height:18px;font-size:11px;color:#40616c;margin-top:6px} @media(max-width:850px){main{grid-template-columns:200px minmax(0,1fr);padding:8px;gap:8px}aside{padding:12px}.data{grid-column:1/3}aside{grid-row:1}.method{display:none}main{min-height:740px}fieldset{margin-bottom:10px}.fixed{margin:10px 0}.readout strong{font-size:16px}.scene-label{display:none}} @media(max-width:540px){header{padding:10px 12px}h1{font-size:16px}header span{display:none}main{height:auto;min-height:0;grid-template-columns:1fr;grid-template-rows:auto 360px auto}aside{grid-row:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}aside h2,aside .note{display:none}aside .key{grid-column:1/3;flex-direction:row;justify-content:center;margin:0}fieldset,.fixed,.actions{margin:0}.data{grid-column:auto;min-height:206px;padding:10px 5px}td,th{padding:7px 3px;font-size:9px}.scene{grid-row:2}.readout{padding:6px}.readouts{gap:4px}.toast{grid-column:1/3}}
@media(min-width:851px) and (max-height:800px){aside{padding:12px}fieldset{margin-bottom:10px}.choice{padding:7px 4px}.choice[aria-pressed=true]{padding:6px 3px}.fixed{margin:10px 0;padding:8px}.actions{margin:10px 0 6px}.btn{padding:7px 9px}.wide{margin-top:5px}.note{margin:8px 0;font-size:11px}.key{margin-top:8px}.method{display:none}aside h2{margin-bottom:8px}}

</style></head><body>
<header><h1>⚡ Water Heating Circuit Lab</h1></header>
<main><aside class="panel"><h2>Experiment setup</h2>
<fieldset><legend>Battery</legend><div class="options battery-options"><button class="choice" data-kind="battery" data-value="A" aria-pressed="true"><strong>1.5 V</strong><small>Battery A</small></button><button class="choice" data-kind="battery" data-value="B" aria-pressed="false"><strong>3.0 V</strong><small>Battery B</small></button><button class="choice" data-kind="battery" data-value="C" aria-pressed="false"><strong>4.5 V</strong><small>Battery C</small></button><button class="choice" data-kind="battery" data-value="D" aria-pressed="false"><strong>6.0 V</strong><small>Battery D</small></button></div></fieldset>
<fieldset><legend>Heating wire</legend><div class="options"><button class="choice" data-kind="wire" data-value="copper" aria-pressed="true">Copper</button><button class="choice" data-kind="wire" data-value="nichrome" aria-pressed="false">Nichrome</button></div></fieldset>
<fieldset><label for="length">Wire length · <output id="lengthText">30 cm</output></label><input id="length" type="range" min="10" max="50" step="10" value="30" list="lengths"><datalist id="lengths"><option value="10"></option><option value="20"></option><option value="30"></option><option value="40"></option><option value="50"></option></datalist><div class="ticks" aria-hidden="true"><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span></div></fieldset>

<fieldset><label for="speed">Simulation speed · <output id="speedText">0.5×</output></label><input id="speed" type="range" min="0.25" max="2" step="0.25" value="0.5"></fieldset>
<button id="connect" class="btn wide">Connect both clips</button><div class="actions"><button id="run" class="btn run">▶ Run</button><button id="pause" class="btn pause" disabled>Ⅱ Pause</button></div><button id="reset" class="btn wide">Reset trial</button><button id="record" class="btn wide" disabled>Record trial</button><div id="message" class="toast" role="status" aria-live="polite"></div>
<div class="key"><span><i></i>Electrical energy</span><span><i class="heat"></i>Thermal energy</span></div></aside>
<section class="scene panel" aria-label="Circuit workspace"><canvas id="lab" aria-label="Heating coil in a beaker with two draggable clips. Use Connect both clips for keyboard control."></canvas><div class="readouts"><div class="readout"><small>Water temperature</small><strong id="temp">20.0°C</strong></div><div class="readout"><small>Time</small><strong id="time">0.0 min</strong></div><div class="readout"><small>Change</small><strong id="delta">+0.0°C</strong></div></div><div id="status" class="status">Attach the clips to complete the circuit.</div></section>
<section class="data panel"><div class="data-head"><h2>Trial data</h2></div><table><thead><tr><th>Trial</th><th>Battery</th><th>Wire</th><th>Length</th><th>Time (min)</th><th>Start (°C)</th><th>Final (°C)</th><th>Change (°C)</th></tr></thead><tbody id="rows"></tbody></table><div class="pager"><button id="prev" aria-label="Previous trials">‹</button><span id="page"></span><button id="next" aria-label="Next trials">›</button></div></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('lab'),ctx=canvas.getContext('2d');
const batteries={A:{label:'1.5 V',power:1},B:{label:'3.0 V',power:1.8},C:{label:'4.5 V',power:2.7},D:{label:'6.0 V',power:3.6}};
const state={battery:'A',wire:'copper',length:30,speed:.5,time:0,start:20,temp:20,running:false,started:false,offset:0,left:false,right:false,recorded:false};
const trials=[];let page=0,drag=null,W=760,H=450,scale=1,ox=0,oy=0,last=0,phase=0;
const loose={left:{x:116,y:342},right:{x:644,y:342}};
function coilWidth(){return 100+state.length*3.6}
function terminal(side){return{x:380+(side==='left'?-1:1)*(coilWidth()/2+14),y:247}}
function clip(side){return state[side]?terminal(side):loose[side]}
function batteryGeometry(){return state.battery==='A'?{x:302,y:360,w:156,h:66}:{x:278,y:346,w:204,h:80}}
function source(side){const b=batteryGeometry();return{x:b.x+(side==='left'?24:b.w-24),y:b.y-8}}
function path(side){const s=source(side),c=clip(side),edge=side==='left'?154:606;return[s,{x:s.x,y:330},{x:edge,y:330},{x:edge,y:c.y},c]}
function ready(){return state.left&&state.right}
function reset(){Object.assign(state,{time:0,temp:20,start:20,running:false,started:false,offset:0,recorded:false});$('message').textContent='Ready for a fresh trial.';sync()}
function sync(){for(const el of document.querySelectorAll('.choice')){el.setAttribute('aria-pressed',String(state[el.dataset.kind]===el.dataset.value));el.disabled=state.started}$('length').disabled=state.started;$('lengthText').textContent=state.length+' cm';$('temp').textContent=state.temp.toFixed(1)+'°C';$('time').textContent=state.time.toFixed(1)+' min';$('delta').textContent='+'+(state.temp-state.start).toFixed(1)+'°C';$('run').disabled=state.running||!ready()||state.temp>=100;$('pause').disabled=!state.running;$('record').disabled=state.time===0||state.recorded;$('connect').disabled=ready()||state.started;$('status').textContent=state.temp>=100?'100°C reached · Trial stopped':state.running?'Circuit complete · Heating the water':state.started?'Trial paused · Resume, record, or reset':ready()?'Circuit complete · Ready to run':'Attach the clips to complete the circuit.'}
document.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{if(state.started)return;state[el.dataset.kind]=el.dataset.value;sync()});$('length').oninput=e=>{state.length=+e.target.value;sync()};$('speed').oninput=e=>{state.speed=+e.target.value;$('speedText').textContent=state.speed+'×'};$('connect').onclick=()=>{state.left=state.right=true;sync()};$('run').onclick=()=>{if(!ready()||state.temp>=100)return;if(!state.started){state.offset=(Math.random()*2-1)*.1;state.started=true}state.running=true;state.recorded=false;$('message').textContent='';sync()};$('pause').onclick=()=>{state.running=false;sync()};$('reset').onclick=reset;
$('record').onclick=()=>{if(!state.time||state.recorded)return;state.running=false;trials.push({battery:batteries[state.battery].label,wire:state.wire==='copper'?'Copper':'Nichrome',length:state.length,time:state.time,start:state.start,final:state.temp});state.recorded=true;page=Math.floor((trials.length-1)/3);renderTable();$('message').textContent='Trial saved. Reset to change variables.';sync()};
function renderTable(){const subset=trials.slice(page*3,page*3+3);$('rows').innerHTML=subset.length?subset.map((t,i)=>`<tr><td>${page*3+i+1}</td><td>${t.battery}</td><td>${t.wire}</td><td>${t.length} cm</td><td>${t.time.toFixed(1)}</td><td>${t.start.toFixed(1)}</td><td>${t.final.toFixed(1)}</td><td>+${(t.final-t.start).toFixed(1)}</td></tr>`).join('')+'<tr aria-hidden="true"><td colspan="8" style="height:'+((3-subset.length)*29)+'px;padding:0;border:0"></td></tr>':'<tr><td colspan="8" class="empty">Run an experiment, then record your trial here.</td></tr>';$('page').textContent=trials.length?`${page*3+1}–${Math.min(page*3+3,trials.length)} of ${trials.length} trials`:'No trials yet';$('prev').disabled=page===0;$('next').disabled=(page+1)*3>=trials.length}
$('prev').onclick=()=>{page--;renderTable()};$('next').onclick=()=>{page++;renderTable()};
function resize(){const r=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);scale=Math.min((W-32)/570,(H-96)/340);ox=W/2-380*scale;oy=70+(H-96-340*scale)/2-95*scale;ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(canvas);
function pointer(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/scale,y:(e.clientY-r.top-oy)/scale}}
canvas.onpointerdown=e=>{if(state.started)return;const p=pointer(e);for(const side of ['left','right'])if(Math.hypot(p.x-clip(side).x,p.y-clip(side).y)<30){drag=side;loose[side]={...clip(side)};state[side]=false;canvas.setPointerCapture(e.pointerId);sync();break}};
canvas.onpointermove=e=>{if(!drag)return;const p=pointer(e);loose[drag]={x:Math.max(116,Math.min(644,p.x)),y:Math.max(110,Math.min(335,p.y))}};
function release(){if(!drag)return;const t=terminal(drag),c=loose[drag];state[drag]=Math.hypot(t.x-c.x,t.y-c.y)<45;if(!state[drag])loose[drag]={x:drag==='left'?116:644,y:310};drag=null;sync()}canvas.onpointerup=release;canvas.onpointercancel=release;
function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function text(s,x,y,size=14,color='#335863',bold=false){ctx.fillStyle=color;ctx.font=`${bold?'600 ':''}${size}px system-ui`;ctx.textAlign='center';ctx.fillText(s,x,y)}
function line(points,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}
function waterShape(){ctx.beginPath();ctx.moveTo(200,148);ctx.lineTo(560,148);ctx.lineTo(550,283);ctx.quadraticCurveTo(380,313,210,283);ctx.closePath()}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);
// Leads occupy separate sides of the beaker and end above the battery.
for(const side of ['left','right'])line(path(side),side==='left'?'#bc4a44':'#344956',5);
ctx.lineWidth=3;rounded(188,103,384,203,18,'#ffffff55','#8caab3');
waterShape();const water=ctx.createLinearGradient(0,148,0,307);water.addColorStop(0,'#8cdbebaa');water.addColorStop(1,'#339bbcaa');ctx.fillStyle=water;ctx.fill();
ctx.save();waterShape();ctx.clip();
// Moving caustics and rising convection make the water remain translucent.
for(let i=0;i<7;i++){ctx.strokeStyle='#defaff55';ctx.lineWidth=2;ctx.beginPath();for(let x=196;x<565;x+=4){const y=173+i*19+Math.sin(x*.025+phase*.8+i)*4;x===196?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}
if(state.temp>35)for(let i=0;i<16;i++){const rise=(phase*(8+(state.temp-35)*.35)+i*19)%145,x=248+(i*47)%267+Math.sin(phase+i)*5,y=285-rise;ctx.strokeStyle='#ecfcff88';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,1.3+(i%3)*.65,0,Math.PI*2);ctx.stroke()}
ctx.restore();ctx.fillStyle='#b8edf0aa';ctx.beginPath();ctx.ellipse(380,148,180,7,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#4cabb9';ctx.lineWidth=1.5;ctx.stroke();
for(let i=1;i<=3;i++){line([{x:528,y:288-i*46},{x:548,y:288-i*46}],'#538796',1);text(i*100+'',515,292-i*46,10,'#477b8b')}
line([{x:197,y:114},{x:204,y:276}],'#ffffffaa',3);
const width=coilWidth(),points=[];for(let i=0;i<=200;i++){const f=i/200;points.push({x:380-width/2+f*width,y:247-Math.sin(f*Math.PI*2*(3+state.length/5))*9})}const left=terminal('left'),right=terminal('right');line([left,...points,right],state.wire==='copper'?'#754821':'#4e626e',7);line([left,...points,right],state.wire==='copper'?'#d08b4f':'#aebec6',4);
text((state.wire==='copper'?'Copper':'Nichrome')+' · '+state.length+' cm',380,280,12,'#285568',true);
for(const side of ['left','right']){const t=terminal(side);ctx.fillStyle=state[side]?'#29876a':'#fbfcf5';ctx.strokeStyle=side==='left'?'#bc4a44':'#344956';ctx.lineWidth=2;ctx.beginPath();ctx.arc(t.x,t.y,7,0,Math.PI*2);ctx.fill();ctx.stroke();const c=clip(side);ctx.save();ctx.translate(c.x,c.y);ctx.scale(side==='left'?1:-1,1);rounded(-19,-7,34,14,4,side==='left'?'#bc4a44':'#344956');rounded(9,-5,15,10,2,'#c8d5db');ctx.restore();}
// Flat, matte battery cases; the 3 V pack is physically larger.
const b=batteryGeometry();for(const side of ['left','right']){const s=source(side);rounded(s.x-9,s.y-2,18,14,3,'#718792')}
rounded(b.x,b.y,b.w,b.h,10,state.battery==='A'?'#276578':'#ad633c');
if(state.battery!=='A'){ctx.strokeStyle='#874526';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(380,b.y+9);ctx.lineTo(380,b.y+b.h-9);ctx.stroke()}
text('+',b.x+23,b.y+20,18,'white',true);text('−',b.x+b.w-23,b.y+20,18,'white',true);text(batteries[state.battery].label,380,b.y+36,state.battery==='A'?22:28,'white',true);text('BATTERY '+state.battery,380,b.y+b.h-10,9,'#ffffffcc',true);
if(state.running){for(const side of ['left','right']){const p=path(side),segments=p.slice(1).map((v,i)=>Math.hypot(v.x-p[i].x,v.y-p[i].y)),total=segments.reduce((a,b)=>a+b,0);for(let j=0;j<5;j++){let d=((phase*.18+j/5)%1)*total;if(side==='right')d=total-d;for(let i=0;i<segments.length;i++){if(d<=segments[i]&&segments[i]>0){const f=d/segments[i];ctx.fillStyle='#3288ff';ctx.beginPath();ctx.arc(p[i].x+(p[i+1].x-p[i].x)*f,p[i].y+(p[i+1].y-p[i].y)*f,4,0,Math.PI*2);ctx.fill();break}d-=segments[i]}}}for(let i=0;i<9;i++){const age=(phase*.4+i/9)%1;ctx.fillStyle=`rgba(220,38,38,${(1-age)*.8})`;ctx.beginPath();ctx.arc(380-width*.4+(i/8)*width*.8+Math.sin(age*5+i)*9,240-age*76,3+age*3,0,Math.PI*2);ctx.fill()}}
// Steam appears gradually as water gets hot, rather than at room temperature.
if(state.temp>45){const opacity=Math.min(.6,(state.temp-45)/80);for(let i=0;i<8;i++){const age=(phase*.11+i/8)%1;ctx.strokeStyle=`rgba(255,255,255,${opacity*Math.sin(age*Math.PI)})`;ctx.lineWidth=5+age*5;ctx.beginPath();const x=253+i*35,y=145-age*64;ctx.moveTo(x,y);ctx.bezierCurveTo(x+15,y-10,x-13,y-23,x+6,y-36);ctx.stroke()}}
ctx.restore()}
function advance(dt){if(!state.running)return;const minutes=dt*.27*state.speed;state.time+=minutes;const rate=(.0046/.0045)*batteries[state.battery].power*(state.wire==='copper'?.75:1.25)*(.65+state.length/50)/3;state.temp=Math.min(100,state.start+rate*state.time+state.offset*Math.min(1,state.time));if(state.temp>=100)state.running=false}
function loop(now){const dt=last?Math.min((now-last)/1000,.1):0;last=now;advance(dt);if(state.running||!state.started)phase+=dt;sync();draw();requestAnimationFrame(loop)}renderTable();sync();requestAnimationFrame(loop);
</script></body></html>
